# Plugin switchboard. A new feature = one new plugin file + one entry here.
# `module` is the import path of the plugin file; everything starts disabled.

collectors:
  garmin_personal_api:
    enabled: true
    module: training_agent.collectors.garmin_personal_api
  strava_export:
    enabled: true
    daily_run: false   # a one-time archive: imported with scripts/import_strava.py, not refreshed every morning
    module: training_agent.collectors.strava_export

storage:
  sqlite:
    enabled: true
    module: training_agent.storage.sqlite

planner_rules:
  readiness_gate:
    enabled: true
    module: training_agent.planner.rules.readiness_gate
  hard_easy_alternation:
    enabled: true
    module: training_agent.planner.rules.hard_easy_alternation
  weekly_load_limit:
    enabled: true
    module: training_agent.planner.rules.weekly_load_limit

# What should each week contain? Sources are tried in the order listed; the first with a plan wins,
# so an event plan (marathon, cycling, triathlon) placed above the template overrides it.
insights:   # advisory guidance shown on the dashboard and in the brief; each is one file in planner/insights/
  sleep_debt:
    enabled: true
    module: training_agent.planner.insights.sleep_debt
  recovery_trend:
    enabled: true
    module: training_agent.planner.insights.recovery_trend
  rest_days:
    enabled: true
    module: training_agent.planner.insights.rest_days
  load_balance:
    enabled: true
    module: training_agent.planner.insights.load_balance
  intensity_mix:
    enabled: true
    module: training_agent.planner.insights.intensity_mix
  consistency:
    enabled: true
    module: training_agent.planner.insights.consistency
  progression:
    enabled: true
    module: training_agent.planner.insights.progression

week_plans:
  event_plan:
    enabled: false
    module: training_agent.planner.week_plans.event_plan
  fixed_template:
    enabled: true
    module: training_agent.planner.week_plans.fixed_template

planner:
  llm_agent:   # first enabled planner is used; it wraps rules_planner and falls back to it without a key
    enabled: true
    module: training_agent.planner.llm_agent
  rules_planner:
    enabled: true
    module: training_agent.planner.rules_planner

outputs:
  console_brief:
    enabled: true
    module: training_agent.outputs.console_brief
  google_calendar:
    enabled: false
    module: training_agent.outputs.google_calendar
  email_brief:
    enabled: false
    module: training_agent.outputs.email_brief
