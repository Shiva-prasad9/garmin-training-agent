<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Training System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <aside id="side">
      <div class="brand">
        <svg class="bolt" viewBox="0 0 24 24" aria-hidden="true"><path d="M13.5 2 4 13.5h6.2L9 22l10-12.2h-6.4z"/></svg>
        <div><h1>Training System</h1><p>Thunder dashboard</p></div>
      </div>
      <nav id="nav" aria-label="Sections"></nav>
      <div class="side-foot">
        <button id="theme" class="ghost" aria-label="Switch between dark and light theme">&#9680; Switch theme</button>
        <p class="muted small">Your data stays on this computer.</p>
      </div>
    </aside>
    <div class="content">
      <header class="top">
        <div>
          <h1 id="pageTitle">Dashboard</h1>
          <p id="subtitle" class="muted">Loading&hellip;</p>
        </div>
        <div class="controls">
          <div class="seg" role="group" aria-label="Trend range" id="range">
            <button data-days="7" aria-pressed="false">7 days</button>
            <button data-days="10" aria-pressed="true">10 days</button>
            <button data-days="14" aria-pressed="false">14 days</button>
          </div>
        </div>
      </header>
      <main id="panels" aria-live="polite"></main>
    </div>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
